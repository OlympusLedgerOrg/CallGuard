name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      # ── Root (Prisma + shared deps) ───────────────────────────────
      - name: Install root dependencies
        run: npm install

      # ── Server ────────────────────────────────────────────────────
      - name: Install server dependencies
        run: npm install
        working-directory: server

      - name: Run server tests
        run: npm test
        working-directory: server
        env:
          NODE_ENV: test
