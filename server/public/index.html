<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CallGuard – AI Receptionist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { background: #030508; color: #EEF2FF; font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React 18 (local) -->
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>

  <!-- API client (sets window.CallGuardAPI / window.CallGuardSocket) -->
  <script type="module" src="/api.js"></script>

  <!-- Load the precompiled dashboard bundle if available; fall back to Babel in dev -->
  <script>
    (function () {
      const rootEl = document.getElementById("root");
      const loadScript = (src, attrs = {}) => new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = src;
        Object.entries(attrs).forEach(([key, value]) => {
          if (value === true) script.setAttribute(key, "");
          else script.setAttribute(key, value);
        });
        script.onload = () => resolve();
        script.onerror = () => reject(new Error(`Failed to load ${src}`));
        document.body.appendChild(script);
      });

      const mountApp = () => {
        function Boot() {
          const AppComp = window.__CallGuardApp;
          if (!AppComp) {
            return React.createElement(
              "div",
              { style: { color: "#7A8BA8", textAlign: "center", paddingTop: "40vh", fontFamily: "DM Sans" } },
              "Loading CallGuard…"
            );
          }
          return React.createElement(AppComp);
        }

        function Root() {
          const [ready, setReady] = React.useState(!!window.__CallGuardApp);
          React.useEffect(() => {
            if (ready) return;
            const t = setInterval(() => {
              if (window.__CallGuardApp) {
                setReady(true);
                clearInterval(t);
              }
            }, 50);
            return () => clearInterval(t);
          }, [ready]);
          return ready ? React.createElement(window.__CallGuardApp) : React.createElement(Boot);
        }

        ReactDOM.createRoot(rootEl).render(React.createElement(Root));
      };

      const loadBabelFallback = async () => {
        await loadScript("/vendor/babel.min.js");
        loadScript("/callguard-app.jsx", {
          type: "text/babel",
          "data-type": "module",
          "data-presets": "react",
        });
        if (window.Babel && window.Babel.transformScriptTags) {
          window.Babel.transformScriptTags();
        }
      };

      // Use no-cache to revalidate bundles when deploying new versions.
      fetch("/app.js", { cache: "no-cache", headers: { Accept: "application/javascript" } })
        .then((res) => {
          const contentType = (res.headers.get("content-type") || "").toLowerCase();
          if (!res.ok || !contentType.includes("javascript")) {
            throw new Error("Missing bundle");
          }
          return loadScript("/app.js");
        })
        .then(() => mountApp())
        .catch(async () => {
          console.warn("Falling back to in-browser Babel compilation.");
          await loadBabelFallback();
          mountApp();
        });
    })();
  </script>

  <!-- ⭐ Offline Mode: register service worker for app caching -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').catch(function(err) { console.warn('SW registration failed:', err); });
      });
    }
  </script>
</body>
</html>
