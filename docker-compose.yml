# ──────────────────────────────────────────────────────────────────────────────
# CallGuard – Docker Compose
#
# Quick start:
#   1. cp server/.env.example server/.env → set Twilio / Google / OpenAI keys
#   2. docker compose up
#
# No external database needed — SQLite is built in.
# ──────────────────────────────────────────────────────────────────────────────
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    env_file:
      - server/.env
    volumes:
      - appdata:/app/data

volumes:
  appdata:
